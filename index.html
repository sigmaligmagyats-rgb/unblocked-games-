<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragons Breath | Unblocked</title>
    <!-- Selenite-style modern font integration -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Left Dashboard Control Sidebar -->
    <aside class="sidebar">
        <div class="logo-container">
            <div class="logo-indicator"></div>
            <span>Dragons Breath</span>
        </div>
        <ul class="nav-menu">
            <li class="nav-link active" data-tab="home"><a href="#">Home</a></li>
            <li class="nav-link" data-tab="games"><a href="#">Games</a></li>
            <li class="nav-link" data-tab="apps"><a href="#">Apps</a></li>
            <li class="nav-link" data-tab="settings"><a href="#">Settings</a></li>
        </ul>
    </aside>

    <!-- Main Dynamic Application Window -->
    <main class="viewport-window">
        <header class="app-header">
            <h2 id="viewHeading">All Projects</h2>
            <div class="search-container">
                <input type="text" class="search-input" id="directorySearch" placeholder="Search unblocked listings...">
            </div>
        </header>

        <!-- Project Directory Layout Grid -->
        <section class="item-grid" id="directoryGrid">
            <!-- Game Card Item 1 -->
            <a href="games/retro-bowl/index.html" class="item-card">
                <div class="item-preview">RB</div>
                <div class="item-title">Retro Bowl</div>
                <div class="item-tag">Sports</div>
            </a>

            <!-- Game Card Item 2 -->
            <a href="games/slope/index.html" class="item-card">
                <div class="item-preview">SL</div>
                <div class="item-title">Slope</div>
                <div class="item-tag">Arcade</div>
            </a>

            <!-- Game Card Item 3 -->
            <a href="games/subway-surfers/index.html" class="item-card">
                <div class="item-preview">SS</div>
                <div class="item-title">Subway Surfers</div>
                <div class="item-tag">Runner</div>
            </a>
        </section>
    </main>

    <!-- Application Script Asset Router -->
    <script src="assets/js/app.js"></script>
</body>
</html>
