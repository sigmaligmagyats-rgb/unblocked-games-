<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Station</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f0f12;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .app-container {
            text-align: center;
            width: 95vw;
            max-width: 1100px;
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .nav-btn {
            background-color: #1f2937;
            color: #9ca3af;
            border: 1px solid #374151;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .nav-btn.active {
            background-color: #4f46e5;
            color: #ffffff;
            border-color: #6366f1;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }
        .theater-stage {
            width: 100%;
            height: 70vh;
            background: #000000;
            border: 2px solid #1f2937;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .action-bar {
            margin-top: 12px;
        }
        .btn-fullscreen {
            background-color: #1f2937;
            color: #f9fafb;
            border: 1px solid #374151;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.15s ease;
        }
        .btn-fullscreen:hover {
            background-color: #4f46e5;
            border-color: #6366f1;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Tab Switches -->
        <nav>
            <button class="nav-btn active" data-game="scale">Scale the Depths</button>
            <button class="nav-btn" data-game="infinite">Infinite Craft</button>
        </nav>
        
        <!-- Shared Theater Stage Layout -->
        <main class="theater-stage">
            <iframe id="gameTheaterFrame" src=""></iframe>
        </main>

        <div class="action-bar">
            <button id="fullscreenBtn" class="btn-fullscreen">Maximize Window</button>
        </div>
    </div>

    <script src="./assets/js/app.js"></script>
</body>
</html>
