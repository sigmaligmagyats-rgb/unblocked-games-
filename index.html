<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selenite Archive</title>
    <!-- Link the custom theme stylesheet you already created -->
    <link rel="stylesheet" href="custom-theme.css">
</head>
<body>

    <!-- Header Navigation Bar -->
    <header class="nav">
        <div class="logo">Selenite <span>Archive</span></div>
        <nav class="nav-bar">
            <a href="#" class="menu-item active">Games</a>
            <a href="#" class="menu-item">Apps</a>
            <a href="#" class="menu-item">Settings</a>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main class="main-container">
        <div class="content">
            <h1>Unblocked Games</h1>
            <p style="color: #bbb; margin-bottom: 40px;">Preserving the original Selenite platform.</p>
            
            <!-- Game Grid Layout -->
            <div class="all-games" id="gameGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 25px; padding: 20px;">
                <!-- Temporary placeholder cards -->
                <div class="game-card" style="padding: 20px; text-align: center; border-radius: 12px; cursor: pointer;">
                    <div style="font-size: 48px; margin-bottom: 10px;">🎮</div>
                    <h3>Game Loader Pending</h3>
                </div>
            </div>
        </div>
    </main>

    <!-- Selenite theme engine script i already modified -->
    <script src="js/themes.js"></script>
</body>
</html>
